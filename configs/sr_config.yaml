# ===== 实验环境配置 =====
seed: 42  # 随机种子，用于确保实验的可重复性 
# exp_name: "v10+lkfb_attn_woact"  # 实验名称
exp_name: "lkfn_3loss" # "v2_cat_backsmfa"  # 实验名称
save_wandb: true  # 是否将训练过程的指标保存到 wandb
project: "ImageSuperResolution"  # wandb 项目名称

# ===== 数据集配置 =====
data_path: "Data/DIV2K"  # 数据集路径
num_workers: 16  # 用于数据加载的并行线程数
extra_data: ''
# - "LISDV/0001000"
# - "LISDV/0002000"
# - "LISDV/0003000"
# - "LISDV/0004000"
# - "LISDV/0005000"
# - "LISDV/0006000"
# - "LISDV/0007000"
# - "LISDV/0008000"
# - "LISDV/0009000"
# - "LISDV/0010000"

# ===== 模型配置 =====
resume: null
checkpoint_path: ''

# ===== 模型配置 =====
upscaling_factor: 2
dim: 32
n_blocks: 8

# ===== 优化器配置 =====
learning_rate: 0.0008  # 学习率
pct_start: 0.06
weight_decay: 0.0  # 权重衰减系数，用于防止过拟合
beta2: 0.999  # Adam 优化器的 beta2 参数

# ===== 训练配置 =====
img_size: 192
train_batch_size: 16  # 批次大小
valid_batch_size: 1
epochs: 800  # 训练的总轮数
use_ema: false
ema_decay: 0.9999
devices: 
- 4
precision: "32"  # 训练使用的精度模式，常见选择包括 32，16，bf16-mixed
gradient_clip_val: 999999.0  # 梯度裁剪的最大值，用于防止梯度爆炸，默认不使用
accumulate_grad_batches: 1  # 梯度累积的 batch 数，用于模拟更大的 batch size，默认不使用

# ===== 监控配置 =====
val_check: 1.0  # 验证集频率，当容易出现过拟合现象的时候可以设置较小的值找到比较好的 checkpoint
log_step: 50  # 日志记录的频率，例如每训练 log_step 个 batch 记录一次